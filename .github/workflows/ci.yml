name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]' ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Test (pytest)
        run: python -m pytest -q -rs
      - name: Offline demo
        run: python examples/demo.py

  lockfile:
    # requirements.lock pins numpy 2.5 / pandas 3.0, which need Python >= 3.12: check the pinned set installs and runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install from requirements.lock
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps
      - name: Offline demo on the pinned set
        run: python examples/demo.py
